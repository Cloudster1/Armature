{{- if .Values.jobs.migrate.enabled }}
{{/*
goose here is the legacy top-level API, which takes no advisory lock - two
concurrent `migrate up` runs are unguarded. Hence one pod, no retries that
could overlap, and a delete policy that replaces a previous hook Job rather
than racing it.

It connects as the owner, not the application role: it creates tables and
grants to roles. The api and the worker would refuse to start as this role.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "armature.fullname" . }}-migrate
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Ordered like the roles Job, and after it.
    {{- include "armature.hookAnnotations" (dict "helm" "post-install,pre-upgrade" "argo" "Sync" "weight" "-4") | nindent 4 }}
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "armature.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "armature.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "armature.image" (dict "root" $ "name" "migrate") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["up"]
          envFrom:
            - configMapRef:
                name: {{ include "armature.fullname" . }}-env
          env:
            # The owner, deliberately: this one writes DDL.
            {{- include "armature.passwordEnv" (dict "root" . "name" "dbOwner" "var" "DB_OWNER_PASSWORD") | nindent 12 }}
            - name: ARMATURE_DB_PRIMARY_URL
              value: {{ include "armature.dbURL" (dict "root" . "role" (include "armature.ownerRole" .) "var" "DB_OWNER_PASSWORD" "host" (include "armature.dbHost" .)) | quote }}
            {{- include "armature.redisEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
