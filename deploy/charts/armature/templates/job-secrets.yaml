{{- if .Values.secrets.generate }}
{{/*
Random passwords, made once, inside the cluster. Rendering them in a template
would not work under Argo CD: it renders without access to the cluster, so
lookup finds nothing and every sync would invent new passwords and overwrite
the ones the database was initialised with.

Runs before everything else, under Helm as pre-install and pre-upgrade, under
Argo CD as PreSync, so the database and every workload find their Secrets
already there.
*/}}
{{- $name := printf "%s-secrets-generator" (include "armature.fullname" .) }}
{{- $bundledDB := or .Values.cnpg.enabled .Values.postgresql.enabled }}
{{- $v := .Values.database }}
{{- $secrets := list
  (dict "name" (include "armature.credentialSecret" (dict "root" . "name" "dbApp")) "user" $v.appRole "generate" true "value" "")
  (dict "name" (include "armature.credentialSecret" (dict "root" . "name" "dbAdmin")) "user" $v.adminRole "generate" true "value" "")
  (dict "name" (include "armature.credentialSecret" (dict "root" . "name" "dbOwner")) "user" (include "armature.ownerRole" .) "generate" $bundledDB "value" "secrets.names.dbOwner")
}}
{{- if include "armature.redisAuth" . }}
{{- $secrets = append $secrets (dict "name" (include "armature.credentialSecret" (dict "root" . "name" "redis")) "user" "default" "generate" .Values.redis.enabled "value" "secrets.names.redis") }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "armature.labels" . | nindent 4 }}
  annotations:
    {{- include "armature.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-40") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "armature.labels" . | nindent 4 }}
  annotations:
    {{- include "armature.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-39") | nindent 4 }}
rules:
  # Kubernetes cannot scope create to resource names, so reading is limited
  # to these Secrets and creating is not.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $secrets }}
      - {{ .name }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "armature.labels" . | nindent 4 }}
  annotations:
    {{- include "armature.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-38") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    {{- include "armature.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-30") | nindent 4 }}
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "armature.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: secrets
          image: {{ include "armature.image" (dict "root" $ "name" "kubectl") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # kubectl keeps its discovery cache under HOME.
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns={{ .Release.Namespace | quote }}

              # A lookup that fails for any reason but NotFound, such as a
              # missing permission, stops the Job. Read as "absent", it would
              # try to create a Secret that may well exist.
              exists() {
                if out=$(kubectl get secret "$1" -n "$ns" -o name 2>&1); then return 0; fi
                case "$out" in *NotFound*) return 1 ;; esac
                echo "$out" >&2
                exit 1
              }

              password() {
                tr -dc A-Za-z0-9 </dev/urandom | head -c {{ int .Values.secrets.passwordLength }}
              }

              # The labels mark it as Armature's without making it Helm's or
              # Argo CD's, so neither deletes it. cnpg.io/reload has the
              # operator apply a changed password straight away.
              create() {
                kubectl create secret generic "$1" -n "$ns" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$2" \
                  --from-literal=password="$(password)" \
                  --dry-run=client -o yaml \
                | kubectl label --local -f - -o yaml \
                    app.kubernetes.io/part-of=armature \
                    app.kubernetes.io/instance={{ .Release.Name | quote }} \
                    cnpg.io/reload=true \
                | kubectl create -f - 2>err || {
                  # Another run got there first, which is the outcome wanted.
                  grep -q AlreadyExists err && return 0
                  cat err >&2
                  exit 1
                }
                echo "created $1 with a random password"
              }
              cd /tmp

              {{- range $secrets }}
              if exists {{ .name | quote }}; then
                echo "{{ .name }} exists and is left as it is"
              {{- if .generate }}
              else
                create {{ .name | quote }} {{ .user | quote }}
              {{- else }}
              else
                echo "Secret {{ .name }} does not exist. The chart cannot make this password up, because the server it belongs to already has one: create it as a kubernetes.io/basic-auth Secret with that password, or name one that exists in {{ .value }}." >&2
                exit 1
              {{- end }}
              fi
              {{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
