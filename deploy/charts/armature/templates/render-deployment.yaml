{{- if .Values.render.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armature.fullname" . }}-render
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: render
spec:
  replicas: {{ .Values.render.replicas }}
  selector:
    matchLabels:
      {{- include "armature.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: render
  template:
    metadata:
      labels:
        {{- include "armature.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: render
    spec:
      serviceAccountName: {{ include "armature.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The Chrome image's own user, not ours: it owns the browser it ships.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: render
          image: {{ include "armature.image" (dict "root" $ "name" "render") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # Chromium writes a scratch profile under HOME. Nothing here needs
            # to outlive the pod.
            - name: HOME
              value: /tmp
            - name: RENDER_PORT
              value: "8090"
            # It prints the application's own pages, so it reaches the web pod
            # in the cluster rather than going out through the ingress.
            - name: RENDER_APP_URL
              value: {{ printf "http://%s-web" (include "armature.fullname" .) | quote }}
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.render.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
