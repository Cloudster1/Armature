{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/*
Only what the chart cannot invent. Database and Redis passwords are in their
own basic-auth Secrets, made by the secrets Job; see job-secrets.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "armature.fullname" . }}-secrets
  labels:
    {{- include "armature.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
type: Opaque
stringData:
  {{- if .Values.s3.enabled }}
  s3-access-key: {{ required "secrets.s3AccessKey is required when s3.enabled is true" .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ required "secrets.s3SecretKey is required when s3.enabled is true" .Values.secrets.s3SecretKey | quote }}
  {{- end }}
  {{- if .Values.mail.pop3.addr }}
  pop3-password: {{ .Values.secrets.pop3Password | quote }}
  {{- end }}
  {{- if .Values.assistant.url }}
  assistant-key: {{ .Values.secrets.assistantKey | quote }}
  {{- end }}
{{- end }}
