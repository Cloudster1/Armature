{{- if .Values.secrets.create }}
{{- $db := include "armature.dbHost" . }}
{{- $port := int .Values.database.port }}
{{- $name := .Values.database.name }}
{{- $ssl := .Values.database.sslmode }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "armature.fullname" . }}-secrets
  labels:
    {{- include "armature.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The app role is subject to every row level security policy; the admin role
  # is exempt by policy rather than by being a superuser, which is why both can
  # pass the check that refuses a privileged role at startup.
  db-primary-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" .Values.database.appRole (required "secrets.appPassword is required when secrets.create is true" .Values.secrets.appPassword) $db $port $name $ssl | quote }}
  db-admin-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" .Values.database.adminRole (required "secrets.adminPassword is required when secrets.create is true" .Values.secrets.adminPassword) $db $port $name $ssl | quote }}
  {{- if .Values.database.replicaHosts }}
  db-replica-urls: {{ range $i, $h := .Values.database.replicaHosts }}{{ if $i }},{{ end }}{{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" $.Values.database.appRole $.Values.secrets.appPassword $h $port $name $ssl }}{{ end }}
  {{- end }}
  # Owned by the roles and migration Jobs only. The api and the worker must
  # never be given this: they refuse to start as a role that bypasses RLS.
  db-owner-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" .Values.database.ownerRole (required "secrets.ownerPassword is required when secrets.create is true" .Values.secrets.ownerPassword) $db $port $name $ssl | quote }}
  db-app-password: {{ .Values.secrets.appPassword | quote }}
  db-admin-password: {{ .Values.secrets.adminPassword | quote }}
  # The bundled database reads this as its superuser password, so the server
  # and the URL the Jobs connect with cannot come to disagree.
  db-owner-password: {{ .Values.secrets.ownerPassword | quote }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  redis-url: {{ printf "redis://%s%s:%d/%d" (ternary (printf ":%s@" .Values.secrets.redisPassword) "" (ne .Values.secrets.redisPassword "")) (include "armature.redisHost" .) (int .Values.externalRedis.port) (int .Values.externalRedis.db) | quote }}
  {{- if .Values.s3.enabled }}
  s3-access-key: {{ required "secrets.s3AccessKey is required when s3.enabled is true" .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ required "secrets.s3SecretKey is required when s3.enabled is true" .Values.secrets.s3SecretKey | quote }}
  {{- end }}
  {{- if .Values.mail.pop3.addr }}
  pop3-password: {{ .Values.secrets.pop3Password | quote }}
  {{- end }}
  {{- if .Values.assistant.url }}
  assistant-key: {{ .Values.secrets.assistantKey | quote }}
  {{- end }}
{{- end }}
