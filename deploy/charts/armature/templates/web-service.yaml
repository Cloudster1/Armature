apiVersion: v1
kind: Service
metadata:
  name: {{ include "armature.fullname" . }}-web
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "armature.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
