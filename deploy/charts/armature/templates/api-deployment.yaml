apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armature.fullname" . }}-api
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "armature.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "armature.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when the configuration changes. Without this an edit to
        # a value would update the ConfigMap and leave the running pods on the
        # old one until something else happened to restart them.
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "armature.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The api drains in-flight requests for 25 seconds after SIGTERM and then
      # flushes traces. Anything shorter than that kills it mid-drain.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "armature.image" (dict "root" $ "name" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "armature.fullname" . }}-env
          env:
            {{- include "armature.secretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            - name: metrics
              containerPort: {{ .Values.telemetry.metricsPort }}
          # Liveness deliberately checks nothing but the process: /healthz
          # answers without touching the database, so an outage of something
          # downstream does not get every pod killed and restarted into it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness does ping the primary, so a pod that cannot reach the
          # database is taken out of the Service until it can.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
