{{- if .Values.postgresql.enabled }}
{{/*
A trial database, not a deployment's. One pod, one volume, no replica and no
backup: the chart says everywhere that a real installation brings its own, and
this exists only so that -f values-demo.yaml comes up against a bare cluster.

Its superuser password is the owner's basic-auth Secret, the same one the roles
and migration Jobs connect with, so there is no second place to keep it.
*/}}
apiVersion: v1
kind: Service
metadata:
  # The name the dbHost helper builds, so the workloads address it the same way
  # whether it was bundled or supplied.
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
  selector:
    {{- include "armature.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "armature.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "armature.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "armature.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own user, not the application's. fsGroup is what makes the
      # volume writable to it.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.postgresql.runAsUser }}
        runAsGroup: {{ .Values.postgresql.runAsGroup }}
        fsGroup: {{ .Values.postgresql.runAsGroup }}
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: {{ .Values.postgresql.terminationGracePeriodSeconds }}
      containers:
        - name: postgresql
          image: {{ include "armature.image" (dict "root" $ "name" "psql") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          args:
            - postgres
            # Surfaces a standby's replay position on the primary. Nothing
            # bundled here replicates, but the pool reads it either way and an
            # off setting reads as a missing standby rather than as no standby.
            - -c
            - track_commit_timestamp=on
          env:
            - name: POSTGRES_USER
              value: {{ include "armature.ownerRole" . | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "armature.credentialSecret" (dict "root" . "name" "dbOwner") }}
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            - name: PGDATA
              value: {{ .Values.postgresql.dataPath | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ include "armature.ownerRole" . | quote }}, "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ include "armature.ownerRole" . | quote }}, "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # The socket directory and the entrypoint's scratch space, which a
            # read only root filesystem would otherwise refuse.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
