        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: armature/migrate:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          args: ["up"]
          envFrom:
            - configMapRef:
                name: armature-env
          env:
            # The owner, deliberately: this one writes DDL. It also overrides
            # the primary URL the ConfigMap and Secret give every other
            # workload, which is why it comes after envFrom.
            - name: ARMATURE_DB_PRIMARY_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-owner-url
            - name: ARMATURE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: redis-url
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
