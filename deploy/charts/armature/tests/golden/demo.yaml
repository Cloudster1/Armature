# Source: armature/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: armature-api
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when the configuration changes. Without this an edit to
        # a value would update the ConfigMap and leave the running pods on the
        # old one until something else happened to restart them.
        checksum/env: e4d1d9199ad3d2ea35baa6a2d6860cfb9190df291b9116ebf4e6b5ad276d516a
    spec:
      serviceAccountName: armature
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # The api drains in-flight requests for 25 seconds after SIGTERM and then
      # flushes traces. Anything shorter than that kills it mid-drain.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: armature/api:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: armature-env
          env:
            - name: ARMATURE_DB_PRIMARY_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-primary-url
            - name: ARMATURE_DB_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-admin-url
            - name: ARMATURE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: redis-url
            - name: ARMATURE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: s3-access-key
            - name: ARMATURE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: s3-secret-key
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Liveness deliberately checks nothing but the process: /healthz
          # answers without touching the database, so an outage of something
          # downstream does not get every pod killed and restarted into it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness does ping the primary, so a pod that cannot reach the
          # database is taken out of the Service until it can.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
