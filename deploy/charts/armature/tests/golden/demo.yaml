# Source: armature/templates/job-roles.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: armature-roles
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: roles
  annotations:
    # post-install, not pre-install: Helm runs pre-install hooks before it
    # creates any of the release's own resources, so this Job's Secret, and a
    # bundled database, would not exist yet. pre-upgrade is safe because both
    # were made by the install before it.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: armature
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: PGURL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-owner-url
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-app-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-admin-password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              DO $$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = "armature_app") THEN
                      CREATE ROLE armature_app LOGIN;
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = "armature_admin") THEN
                      CREATE ROLE armature_admin LOGIN;
                  END IF;
              END;
              $$;
              SQL
              # The passwords are set outside the DO block: they change between
              # installs, and ALTER is the only idempotent way to say so.
              psql -v ON_ERROR_STOP=1 "$PGURL" \
                -c "ALTER ROLE armature_app WITH PASSWORD '$APP_PASSWORD'" \
                -c "ALTER ROLE armature_admin WITH PASSWORD '$ADMIN_PASSWORD'"
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              GRANT CONNECT ON DATABASE armature TO armature_app, armature_admin;
              GRANT USAGE ON SCHEMA public TO armature_app, armature_admin;

              -- The pool reads pg_stat_wal_receiver to tell a caught-up standby
              -- from one whose receiver has quietly dropped.
              GRANT pg_read_all_stats TO armature_app, armature_admin;

              -- Everything the migrations create afterwards is granted without
              -- anybody remembering to. FOR ROLE is the role that will create
              -- them, which is the one this Job connects as.
              ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO armature_app, armature_admin;
              ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
                  GRANT USAGE, SELECT ON SEQUENCES TO armature_app, armature_admin;
              ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
                  GRANT EXECUTE ON FUNCTIONS TO armature_app, armature_admin;
              SQL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
