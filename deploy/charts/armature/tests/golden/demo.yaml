type: Opaque
stringData:
  # The app role is subject to every row level security policy; the admin role
  # is exempt by policy rather than by being a superuser, which is why both can
  # pass the check that refuses a privileged role at startup.
  db-primary-url: "postgres://armature_app:armature_app@armature-postgresql:5432/armature?sslmode=disable"
  db-admin-url: "postgres://armature_admin:armature_admin@armature-postgresql:5432/armature?sslmode=disable"
  # Owned by the roles and migration Jobs only. The api and the worker must
  # never be given this: they refuse to start as a role that bypasses RLS.
  db-owner-url: "postgres://postgres:armature@armature-postgresql:5432/armature?sslmode=disable"
  db-app-password: "armature_app"
  db-admin-password: "armature_admin"
  # The bundled database reads this as its superuser password, so the server
  # and the URL the Jobs connect with cannot come to disagree.
  db-owner-password: "armature"
  redis-url: "redis://armature-redis-master:6379/0"
  s3-access-key: "armature"
  s3-secret-key: "armature-dev-secret"
