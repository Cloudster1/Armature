apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: armature-postgresql
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: postgresql
spec:
  serviceName: armature-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: postgresql
    spec:
      # The image's own user, not the application's. fsGroup is what makes the
      # volume writable to it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          args:
            - postgres
            # Surfaces a standby's replay position on the primary. Nothing
            # bundled here replicates, but the pool reads it either way and an
            # off setting reads as a missing standby rather than as no standby.
            - -c
            - track_commit_timestamp=on
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "armature"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-owner-password
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            - name: PGDATA
              value: "/var/lib/postgresql/18/docker"
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "armature"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "armature"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # The socket directory and the entrypoint's scratch space, which a
            # read only root filesystem would otherwise refuse.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
