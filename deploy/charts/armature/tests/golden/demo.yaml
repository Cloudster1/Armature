              -ip.bind=0.0.0.0 \
              -port=8333 \
              -metricsPort 9327 \
              -config=/etc/sw/seaweedfs_s3_config \
              -filer=armature-seaweedfs-filer-client.default:8888 \
              -port.lance=9101 \
          volumeMounts:
            - name: logs
              mountPath: "/logs/"
            - mountPath: /etc/sw
              name: config-users
              readOnly: true
            
          ports:
            - containerPort: 8333
              name: swfs-s3
            - containerPort: 9101
              name: swfs-lance
            - containerPort: 9327
