apiVersion: v1
kind: Secret
metadata:
  name: armature-secrets
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
type: Opaque
stringData:
  # The app role is subject to every row level security policy; the admin role
  # is exempt by policy rather than by being a superuser, which is why both can
  # pass the check that refuses a privileged role at startup.
  db-primary-url: "postgres://armature_app:app-password@db.example.com:5432/armature?sslmode=require"
  db-admin-url: "postgres://armature_admin:admin-password@db.example.com:5432/armature?sslmode=require"
  # Owned by the roles and migration Jobs only. The api and the worker must
  # never be given this: they refuse to start as a role that bypasses RLS.
  db-owner-url: "postgres://postgres:owner-password@db.example.com:5432/armature?sslmode=require"
  db-app-password: "app-password"
  db-admin-password: "admin-password"
  # The bundled database reads this as its superuser password, so the server
  # and the URL the Jobs connect with cannot come to disagree.
  db-owner-password: "owner-password"
  redis-url: "redis://redis.example.com:6379/0"
