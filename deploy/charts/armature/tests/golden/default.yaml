apiVersion: apps/v1
kind: Deployment
metadata:
  name: armature-worker
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a rolling update would briefly run two
  # workers, which is the thing the single replica exists to prevent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: worker
      annotations:
        checksum/env: ea42183d862fb2fcdcb82ff5224f1136346b97f0169a101451fb621c2d97dab3
    spec:
      serviceAccountName: armature
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Loops stop at their next poll boundary; the longest Redis block is 5s.
      terminationGracePeriodSeconds: 20
      containers:
        - name: worker
          image: armature/worker:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: armature-env
          env:
            - name: ARMATURE_DB_PRIMARY_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-primary-url
            - name: ARMATURE_DB_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: db-admin-url
            - name: ARMATURE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: armature-secrets
                  key: redis-url
          ports:
            - name: metrics
              containerPort: 9090
          # The only endpoint the worker has is the metrics mux's /healthz,
          # which answers 200 whenever the process is up and checks nothing.
          # That makes it a fair liveness probe and a useless readiness one, so
          # there is no readiness probe here rather than a dishonest one.
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
