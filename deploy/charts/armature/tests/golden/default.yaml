    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
