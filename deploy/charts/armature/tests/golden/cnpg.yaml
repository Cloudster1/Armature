    # post-install, not pre-install: Helm runs pre-install hooks before it
    # creates any of the release's own resources, so a bundled database would
    # not exist yet. pre-upgrade is safe because the install made it. Argo CD
    # runs it in the Sync phase, after the database's wave has turned healthy
    # and before the workloads; a PostSync hook would wait on an api that
    # cannot become ready until this has run.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  # Covers a first CNPG cluster coming up, which takes a few minutes.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: armature
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-db-owner
                  key: password
            # A host that drops packets would otherwise hold a connect open
            # until the Job's deadline.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGURL
              value: "postgres://armature_owner:$(DB_OWNER_PASSWORD)@armature-postgres-rw:5432/armature?sslmode=require"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The database may still be starting: a bundled pod, or a CNPG
              # cluster created moments ago in the same sync.
              until psql "$PGURL" -Atc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for the database to accept the owner role"
                sleep 5
              done
              until [ "$(psql "$PGURL" -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('armature_app', 'armature_admin')")" = 2 ]; do
                echo "waiting for the operator to create armature_app, armature_admin"
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              GRANT CONNECT ON DATABASE armature TO armature_app, armature_admin;
              GRANT USAGE ON SCHEMA public TO armature_app, armature_admin;

              -- Everything the migrations create afterwards is granted without
              -- anybody remembering to. FOR ROLE is the role that will create
              -- them, which is the one this Job connects as.
              ALTER DEFAULT PRIVILEGES FOR ROLE armature_owner IN SCHEMA public
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO armature_app, armature_admin;
              ALTER DEFAULT PRIVILEGES FOR ROLE armature_owner IN SCHEMA public
                  GRANT USAGE, SELECT ON SEQUENCES TO armature_app, armature_admin;
              ALTER DEFAULT PRIVILEGES FOR ROLE armature_owner IN SCHEMA public
                  GRANT EXECUTE ON FUNCTIONS TO armature_app, armature_admin;
              SQL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
# Source: armature/templates/job-secrets.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: armature-secrets-generator
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: Never
      serviceAccountName: armature-secrets-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: secrets
          image: alpine/kubectl:1.34.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # kubectl keeps its discovery cache under HOME.
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns="default"

              # A lookup that fails for any reason but NotFound, such as a
              # missing permission, stops the Job. Read as "absent", it would
              # try to create a Secret that may well exist.
              exists() {
                if out=$(kubectl get secret "$1" -n "$ns" -o name 2>&1); then return 0; fi
                case "$out" in *NotFound*) return 1 ;; esac
                echo "$out" >&2
                exit 1
              }

              password() {
                tr -dc A-Za-z0-9 </dev/urandom | head -c 32
              }

              # The labels mark it as Armature's without making it Helm's or
              # Argo CD's, so neither deletes it. cnpg.io/reload has the
              # operator apply a changed password straight away.
              create() {
                kubectl create secret generic "$1" -n "$ns" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$2" \
                  --from-literal=password="$(password)" \
                  --dry-run=client -o yaml \
                | kubectl label --local -f - -o yaml \
                    app.kubernetes.io/part-of=armature \
                    app.kubernetes.io/instance="armature" \
                    cnpg.io/reload=true \
                | kubectl create -f - 2>err || {
                  # Another run got there first, which is the outcome wanted.
                  grep -q AlreadyExists err && return 0
                  cat err >&2
                  exit 1
                }
                echo "created $1 with a random password"
              }
              cd /tmp
              if exists "armature-db-app"; then
                echo "armature-db-app exists and is left as it is"
              else
                create "armature-db-app" "armature_app"
              fi
              if exists "armature-db-admin"; then
                echo "armature-db-admin exists and is left as it is"
              else
                create "armature-db-admin" "armature_admin"
              fi
              if exists "armature-db-owner"; then
                echo "armature-db-owner exists and is left as it is"
              else
                create "armature-db-owner" "armature_owner"
              fi
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
