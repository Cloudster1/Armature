    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a rolling update would briefly run two
  # workers, which is the thing the single replica exists to prevent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: worker
      annotations:
        checksum/env: 55b96a3e263100a26453b5d78eeecd2fdd493f4de2cc3d1db347be0ea79e7925
    spec:
      serviceAccountName: armature
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Loops stop at their next poll boundary; the longest Redis block is 5s.
      terminationGracePeriodSeconds: 20
      containers:
        - name: worker
          image: armature/worker:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: armature-env
          env:
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-db-app
                  key: password
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-db-admin
                  key: password
            - name: ARMATURE_DB_PRIMARY_URL
              value: "postgres://armature_app:$(DB_APP_PASSWORD)@armature-postgres-rw:5432/armature?sslmode=require"
            - name: ARMATURE_DB_ADMIN_URL
              value: "postgres://armature_admin:$(DB_ADMIN_PASSWORD)@armature-postgres-rw:5432/armature?sslmode=require"
            - name: ARMATURE_DB_REPLICA_URLS
              value: "postgres://armature_app:$(DB_APP_PASSWORD)@armature-postgres-ro:5432/armature?sslmode=require"
            - name: ARMATURE_REDIS_URL
              value: "redis://redis.example.com:6379/0"
          ports:
            - name: metrics
              containerPort: 9090
          # The only endpoint the worker has is the metrics mux's /healthz,
          # which answers 200 whenever the process is up and checks nothing.
          # That makes it a fair liveness probe and a useless readiness one, so
          # there is no readiness probe here rather than a dishonest one.
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
