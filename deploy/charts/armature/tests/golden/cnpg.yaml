apiVersion: apps/v1
kind: Deployment
metadata:
  name: armature-api
  labels:
    helm.sh/chart: armature-0.1.0
    app.kubernetes.io/name: armature
    app.kubernetes.io/instance: armature
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: armature
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when the configuration changes. Without this an edit to
        # a value would update the ConfigMap and leave the running pods on the
        # old one until something else happened to restart them.
        checksum/env: 55b96a3e263100a26453b5d78eeecd2fdd493f4de2cc3d1db347be0ea79e7925
    spec:
      serviceAccountName: armature
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # The api drains in-flight requests for 25 seconds after SIGTERM and then
      # flushes traces. Anything shorter than that kills it mid-drain.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: armature/api:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: armature-env
          env:
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-db-app
                  key: password
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armature-db-admin
                  key: password
            - name: ARMATURE_DB_PRIMARY_URL
              value: "postgres://armature_app:$(DB_APP_PASSWORD)@armature-postgres-rw:5432/armature?sslmode=require"
            - name: ARMATURE_DB_ADMIN_URL
              value: "postgres://armature_admin:$(DB_ADMIN_PASSWORD)@armature-postgres-rw:5432/armature?sslmode=require"
            - name: ARMATURE_DB_REPLICA_URLS
              value: "postgres://armature_app:$(DB_APP_PASSWORD)@armature-postgres-ro:5432/armature?sslmode=require"
            - name: ARMATURE_REDIS_URL
              value: "redis://redis.example.com:6379/0"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Liveness deliberately checks nothing but the process: /healthz
          # answers without touching the database, so an outage of something
          # downstream does not get every pod killed and restarted into it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness does ping the primary, so a pod that cannot reach the
          # database is taken out of the Service until it can.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
