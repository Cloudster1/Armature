      app.kubernetes.io/name: armature
      app.kubernetes.io/instance: armature
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armature
        app.kubernetes.io/instance: armature
        app.kubernetes.io/component: web
      annotations:
        checksum/nginx: 2cbc4632cd1ad517fe39530f835fa8a4653ef6e1acbd198a71e7d6063eab8efb
    spec:
      serviceAccountName: armature
      # The image is stock nginx, whose master would normally start as root.
      # It runs as the image's own nginx user instead, which is why the server
      # block listens on 8080 rather than 80 and why the writable paths below
      # are mounted: the root filesystem is read only.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: armature/web:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: armature-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
