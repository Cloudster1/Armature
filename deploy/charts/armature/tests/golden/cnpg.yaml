data:
  ARMATURE_ENV: "production"
  ARMATURE_LOG_LEVEL: "info"
  ARMATURE_APP_URL: "https://armature.example.com"
  ARMATURE_HTTP_ADDR: ":8080"
  ARMATURE_METRICS_ADDR: ":9090"
  
  # Database pool. The URLs themselves carry credentials and live in the Secret.
  ARMATURE_DB_MAX_CONNS: "20"
  ARMATURE_DB_MIN_CONNS: "2"
  ARMATURE_DB_CONN_MAX_LIFETIME: "1h"
  ARMATURE_DB_HEALTH_INTERVAL: "5s"
  ARMATURE_DB_MAX_REPLICA_LAG: "2s"
  ARMATURE_DB_REPLICA_LAG_SAMPLES: "3"
  
  # Sessions and hashing. secureCookies must be true unless env is development,
  # on the worker as much as the api: they share one configuration loader.
  ARMATURE_SESSION_TTL: "720h"
  ARMATURE_SESSION_COOKIE: "armature_session"
  ARMATURE_SECURE_COOKIES: "true"
  ARMATURE_ARGON_MEMORY_KIB: "65536"
  ARMATURE_ARGON_ITERATIONS: "3"
  ARMATURE_ARGON_THREADS: "4"
  ARMATURE_READ_YOUR_WRITES_TTL: "30s"
  ARMATURE_PORTAL_CODE_COOLDOWN: "1m"
  ARMATURE_OIDC_REDIRECT_URL: "https://armature.example.com/api/v1/auth/oidc/callback"
  
  
  ARMATURE_RETAIN_SESSIONS: "24h"
  ARMATURE_RETAIN_PORTAL_CODES: "24h"
  ARMATURE_RETAIN_INVITES: "720h"
  ARMATURE_RETAIN_API_TOKENS: "720h"
  ARMATURE_RETAIN_OIDC_LOGINS: "24h"
  ARMATURE_RETAIN_NOTIFICATIONS: "4320h"
  ARMATURE_RETAIN_OUTBOX: "720h"
  ARMATURE_RETAIN_WEBHOOK_DELIVERIES: "720h"
  ARMATURE_RETAIN_AUTOMATION_RUNS: "2160h"
  ARMATURE_RETAIN_INBOUND_MAIL: "2160h"
  ARMATURE_RETAIN_IMPORT_JOBS: "2160h"
  ARMATURE_RETAIN_AUDIT: "8760h"
