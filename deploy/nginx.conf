server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # What a browser should refuse to do with this application. The app needs
    # inline styles (Tailwind writes them) and talks to its own origin only.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The API is served from the same origin as the app, so the session cookie
    # is first-party and no CORS configuration is involved.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client side routing: unknown paths are app routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
